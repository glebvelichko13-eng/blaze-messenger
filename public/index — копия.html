<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мессенджер</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial; }
  body {
    background: linear-gradient(135deg, #0b141a, #1f2c33);
    display: flex; justify-content: center; align-items: center;
    height: 100vh; color: #e9edef;
  }
  .box {
    background: #202c33; padding: 30px; border-radius: 15px;
    width: 340px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  h2 { text-align: center; margin-bottom: 20px; color: #00a884; }
  input {
    width: 100%; padding: 12px; margin-bottom: 12px;
    background: #2a3942; border: none; border-radius: 8px;
    color: #e9edef; font-size: 15px; outline: none;
  }
  input:focus { border: 1px solid #00a884; }
  button {
    width: 100%; padding: 12px; background: #00a884; color: white;
    border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
    cursor: pointer; margin-top: 5px;
  }
  button:hover { background: #06cf9c; }
  .toggle {
    text-align: center; margin-top: 15px; font-size: 14px;
    color: #8696a0; cursor: pointer;
  }
  .toggle:hover { color: #00a884; }
  .error {
    color: #ff6b6b; text-align: center; margin-top: 10px;
    font-size: 14px; min-height: 18px;
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="box">
  <h2 id="title">Вход</h2>
  <input id="phone" placeholder="Номер телефона">
  <input id="password" type="password" placeholder="Пароль">
  <input id="name" placeholder="Имя" class="hidden">
  <button onclick="submitForm()" id="btn">Войти</button>
  <div class="toggle" onclick="toggleMode()" id="toggle">Нет аккаунта? Зарегистрироваться</div>
  <div class="error" id="error"></div>
</div>

<script>
  let isLogin = true;

  function toggleMode() {
    isLogin = !isLogin;
    document.getElementById('title').textContent = isLogin ? 'Вход' : 'Регистрация';
    document.getElementById('btn').textContent = isLogin ? 'Войти' : 'Зарегистрироваться';
    document.getElementById('toggle').textContent = isLogin
      ? 'Нет аккаунта? Зарегистрироваться'
      : 'Уже есть аккаунт? Войти';
    document.getElementById('name').classList.toggle('hidden', isLogin);
    document.getElementById('error').textContent = '';
  }

  async function submitForm() {
    const phone = document.getElementById('phone').value.trim();
    const password = document.getElementById('password').value;
    const name = document.getElementById('name').value.trim();
    const error = document.getElementById('error');
    error.textContent = '';

    if (!phone || !password) {
      error.textContent = 'Заполни все поля';
      return;
    }

    const url = isLogin ? '/login' : '/register';
    const body = isLogin ? { phone, password } : { phone, password, name };

    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();

      if (data.ok) {
        window.location.href = '/chat.html';
      } else {
        error.textContent = data.error || 'Ошибка';
      }
    } catch (e) {
      error.textContent = 'Ошибка соединения';
    }
  }

  document.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') submitForm();
  });
</script>
</body>
</html>
