<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мессенджер</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial; }
  body {
    background: #0b141a; height: 100vh; display: flex;
    justify-content: center; align-items: center;
  }
  .app {
    width: 100%; max-width: 900px; height: 95vh;
    background: #111b21; display: flex;
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 0 30px rgba(0,0,0,0.7);
  }

  /* ===== САЙДБАР (СЛЕВА) ===== */
  .sidebar {
    width: 320px; background: #111b21;
    border-right: 1px solid #2a3942;
    display: flex; flex-direction: column;
  }
  .sidebar-header {
    background: #202c33; padding: 12px 15px;
    color: #e9edef; font-weight: bold; font-size: 16px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .sidebar-header .me { font-size: 12px; color: #8696a0; font-weight: normal; }
  .logout-btn {
    background: transparent; border: none; color: #8696a0;
    cursor: pointer; font-size: 18px;
  }
  .logout-btn:hover { color: #ff6b6b; }

  .chats-list { flex: 1; overflow-y: auto; }

  .chat-item {
    padding: 12px 15px; cursor: pointer;
    border-bottom: 1px solid #1f2c33;
    display: flex; gap: 10px; align-items: center;
    transition: background 0.15s;
  }
  .chat-item:hover { background: #202c33; }
  .chat-item.active { background: #2a3942; }

  .chat-avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: #6a7175; display: flex;
    align-items: center; justify-content: center;
    color: white; font-weight: bold; font-size: 16px;
    flex-shrink: 0;
  }
  .chat-avatar.group { background: #00a884; }

  .chat-info { flex: 1; overflow: hidden; }
  .chat-title {
    color: #e9edef; font-size: 15px; font-weight: bold;
    display: flex; align-items: center; gap: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chat-title.creator {
    background: linear-gradient(90deg, #00ff88, #ffd700, #00ff88);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 2s linear infinite;
  }
  .chat-title.creator::after {
    content: ' 👑';
    -webkit-text-fill-color: initial;
  }
  @keyframes shine { to { background-position: 200% center; } }

  .chat-subtitle {
    color: #8696a0; font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .empty-chats {
    padding: 30px 15px; text-align: center; color: #8696a0; font-size: 14px;
  }

  /* ===== КНОПКИ СОЗДАНИЯ ===== */
  .create-btns {
    background: #202c33; padding: 8px;
    display: flex; gap: 6px;
  }
  .create-btns button {
    flex: 1; padding: 9px; border: none; border-radius: 8px;
    background: #00a884; color: white; cursor: pointer;
    font-size: 13px; font-weight: bold;
  }
  .create-btns button:hover { background: #06cf9c; }

  /* ===== ОСНОВНОЙ ЧАТ (СПРАВА) ===== */
  .main {
    flex: 1; display: flex; flex-direction: column;
    background: #0b141a;
  }
  .main-header {
    background: #202c33; padding: 12px 18px;
    color: #e9edef; font-size: 16px; font-weight: bold;
    border-bottom: 1px solid #1f2c33;
  }
  .main-header.creator {
    background: linear-gradient(90deg, #00ff88, #ffd700, #00ff88);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 2s linear infinite;
  }
  .main-header.creator::after { content: ' 👑'; -webkit-text-fill-color: initial; }

  .messages {
    flex: 1; overflow-y: auto; padding: 15px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .msg {
    max-width: 70%; padding: 7px 11px; border-radius: 10px;
    background: #202c33; color: #e9edef; align-self: flex-start;
    word-wrap: break-word; font-size: 15px;
  }
  .msg.mine { background: #005c4b; align-self: flex-end; }
  .msg .name {
    font-size: 12px; color: #53bdeb; font-weight: bold; margin-bottom: 3px;
  }
  .msg .name.creator {
    background: linear-gradient(90deg, #00ff88, #ffd700, #00ff88);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 2s linear infinite;
  }
  .msg .name.creator::after { content: ' 👑'; -webkit-text-fill-color: initial; }
  .msg.mine .name { display: none; }
  .msg .time {
    font-size: 10px; color: #8696a0; float: right;
    margin-left: 8px; margin-top: 5px;
  }

  .empty-main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: #8696a0; font-size: 15px; text-align: center; padding: 20px;
  }

  .input-area {
    display: flex; padding: 10px; background: #202c33; gap: 8px;
  }
  .input-area input {
    flex: 1; padding: 11px 15px; border: none; border-radius: 20px;
    background: #2a3942; color: #e9edef; font-size: 15px; outline: none;
  }
  .input-area button {
    padding: 0 20px; border: none; border-radius: 20px;
    background: #00a884; color: white; cursor: pointer;
    font-size: 18px; font-weight: bold;
  }
  .input-area button:hover { background: #06cf9c; }

  /* ===== МОДАЛЬНОЕ ОКНО ===== */
  .modal {
    display: none; position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7); z-index: 100;
    justify-content: center; align-items: center;
  }
  .modal.active { display: flex; }
  .modal-box {
    background: #202c33; padding: 20px; border-radius: 12px;
    width: 380px; max-height: 80vh; overflow-y: auto;
    color: #e9edef;
  }
  .modal-box h3 { margin-bottom: 15px; color: #00a884; }
  .modal-box input {
    width: 100%; padding: 10px; margin-bottom: 12px;
    background: #2a3942; border: none; border-radius: 8px;
    color: #e9edef; font-size: 14px; outline: none;
  }
  .modal-box .user-list {
    max-height: 250px; overflow-y: auto;
    margin-bottom: 12px; background: #111b21; border-radius: 8px;
  }
  .modal-box .user-item {
    padding: 10px 12px; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid #202c33;
  }
  .modal-box .user-item:hover { background: #2a3942; }
  .modal-box .user-item input[type="checkbox"] {
    width: auto; margin: 0; cursor: pointer;
  }
  .modal-box .user-item .uname { flex: 1; font-size: 14px; }
  .modal-box .user-item .uname.creator {
    background: linear-gradient(90deg, #00ff88, #ffd700, #00ff88);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 2s linear infinite;
  }
  .modal-box .user-item .uname.creator::after {
    content: ' 👑'; -webkit-text-fill-color: initial;
  }
  .modal-box .actions { display: flex; gap: 8px; }
  .modal-box .actions button {
    flex: 1; padding: 10px; border: none; border-radius: 8px;
    cursor: pointer; font-weight: bold; font-size: 14px;
  }
  .modal-box .actions .primary { background: #00a884; color: white; }
  .modal-box .actions .cancel { background: #2a3942; color: #e9edef; }
  .modal-box .actions button:hover { opacity: 0.9; }
</style>
</head>
<body>
<div class="app">
  <!-- САЙДБАР -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div>
        💬 Чаты
        <div class="me" id="me">Загрузка...</div>
      </div>
      <button class="logout-btn" onclick="logout()" title="Выйти">⏻</button>
    </div>
    <div class="chats-list" id="chatsList"></div>
    <div class="create-btns">
      <button onclick="openPrivateModal()">+ Личный</button>
      <button onclick="openGroupModal()">+ Группа</button>
    </div>
  </div>

  <!-- ОСНОВНОЙ ЧАТ -->
  <div class="main">
    <div id="mainHeader" class="main-header" style="display:none;"></div>
    <div class="messages" id="messages" style="display:none;"></div>
    <div class="empty-main" id="emptyMain">
      Выбери чат слева<br>или создай новый
    </div>
    <div class="input-area" id="inputArea" style="display:none;">
      <input id="msgInput" placeholder="Сообщение..." autocomplete="off">
      <button onclick="send()">➤</button>
    </div>
  </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО: ЛИЧНЫЙ ЧАТ -->
<div class="modal" id="privateModal">
  <div class="modal-box">
    <h3>Новый личный чат</h3>
    <div class="user-list" id="privateUsers"></div>
    <div class="actions">
      <button class="cancel" onclick="closeModal('privateModal')">Отмена</button>
    </div>
  </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО: ГРУППА -->
<div class="modal" id="groupModal">
  <div class="modal-box">
    <h3>Новая группа</h3>
    <input id="groupName" placeholder="Название группы">
    <div class="user-list" id="groupUsers"></div>
    <div class="actions">
      <button class="cancel" onclick="closeModal('groupModal')">Отмена</button>
      <button class="primary" onclick="createGroup()">Создать</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  let socket = null;
  let me = null;
  let currentChatId = null;
  let allUsers = [];

  async function init() {
    const res = await fetch('/me');
    const data = await res.json();
    if (!data.ok) { window.location.href = '/'; return; }

    me = data;
    document.getElementById('me').textContent = me.name + (me.role === 'creator' ? ' 👑' : '');

    socket = io({ query: { userId: me.id, name: me.name, role: me.role } });

    socket.on('message', (data) => {
      if (data.chatId === currentChatId) {
        addMessage(data.name, data.text, data.time, data.name === me.name, data.role === 'creator');
      }
    });

    await loadUsers();
    await loadChats();
  }

  async function loadUsers() {
    const res = await fetch('/users');
    const data = await res.json();
    if (data.ok) allUsers = data.users;
  }

  async function loadChats() {
    const res = await fetch('/chats');
    const data = await res.json();
    const box = document.getElementById('chatsList');
    box.innerHTML = '';

    if (!data.ok || data.chats.length === 0) {
      box.innerHTML = '<div class="empty-chats">Нет чатов.<br>Создай первый!</div>';
      return;
    }

    data.chats.forEach(c => {
      const div = document.createElement('div');
      div.className = 'chat-item' + (c.id === currentChatId ? ' active' : '');
      div.onclick = () => openChat(c.id, c.title, c.role);
      const letter = c.title[0] ? c.title[0].toUpperCase() : '?';

      div.innerHTML = `
        <div class="chat-avatar ${c.type === 'group' ? 'group' : ''}">${c.type === 'group' ? '👥' : letter}</div>
        <div class="chat-info">
          <div class="chat-title ${c.role === 'creator' ? 'creator' : ''}">${escapeHtml(c.title)}</div>
          <div class="chat-subtitle">${c.type === 'group' ? 'Группа' : 'Личный чат'}</div>
        </div>
      `;
      box.appendChild(div);
    });
  }

  async function openChat(chatId, title, role) {
    currentChatId = chatId;
    socket.emit('join_chat', chatId);

    document.getElementById('mainHeader').style.display = 'block';
    document.getElementById('mainHeader').textContent = title;
    document.getElementById('mainHeader').className = 'main-header' + (role === 'creator' ? ' creator' : '');

    document.getElementById('messages').style.display = 'flex';
    document.getElementById('messages').innerHTML = '';
    document.getElementById('emptyMain').style.display = 'none';
    document.getElementById('inputArea').style.display = 'flex';

    const res = await fetch('/chats/' + chatId + '/messages');
    const data = await res.json();
    if (data.ok) {
      data.messages.forEach(m => {
        addMessage(m.name, m.text, formatTime(m.created_at), m.name === me.name, m.role === 'creator');
      });
    }

    await loadChats();
  }

  function addMessage(name, text, time, isMine, isCreator) {
    const box = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg' + (isMine ? ' mine' : '');

    if (!isMine) {
      const nameDiv = document.createElement('div');
      nameDiv.className = 'name' + (isCreator ? ' creator' : '');
      nameDiv.textContent = name;
      div.appendChild(nameDiv);
    }

    div.appendChild(document.createTextNode(text));

    const timeSpan = document.createElement('span');
    timeSpan.className = 'time';
    timeSpan.textContent = time;
    div.appendChild(timeSpan);

    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function formatTime(str) {
    if (!str) return '';
    const d = new Date(str.includes('T') ? str : str.replace(' ', 'T') + 'Z');
    return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }

  function send() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text || !currentChatId) return;
    socket.emit('message', { chatId: currentChatId, text });
    input.value = '';
    input.focus();
  }

  // ===== МОДАЛКА: ЛИЧНЫЙ ЧАТ =====
  function openPrivateModal() {
    const box = document.getElementById('privateUsers');
    box.innerHTML = '';
    if (allUsers.length === 0) {
      box.innerHTML = '<div style="padding:15px;color:#8696a0;">Нет других пользователей</div>';
    } else {
      allUsers.forEach(u => {
        const div = document.createElement('div');
        div.className = 'user-item';
        div.onclick = () => createPrivateChat(u.id);
        div.innerHTML = `<div class="uname ${u.role === 'creator' ? 'creator' : ''}">${escapeHtml(u.name)}</div>`;
        box.appendChild(div);
      });
    }
    document.getElementById('privateModal').classList.add('active');
  }

  async function createPrivateChat(userId) {
    const res = await fetch('/chats/private', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId })
    });
    const data = await res.json();
    if (data.ok) {
      closeModal('privateModal');
      await loadChats();
      socket.emit('join_chat', data.chatId);
      const user = allUsers.find(u => u.id === userId);
      if (user) openChat(data.chatId, user.name, user.role);
    } else {
      alert(data.error || 'Ошибка');
    }
  }

  // ===== МОДАЛКА: ГРУППА =====
  function openGroupModal() {
    const box = document.getElementById('groupUsers');
    box.innerHTML = '';
    document.getElementById('groupName').value = '';
    if (allUsers.length === 0) {
      box.innerHTML = '<div style="padding:15px;color:#8696a0;">Нет других пользователей</div>';
    } else {
      allUsers.forEach(u => {
        const div = document.createElement('div');
        div.className = 'user-item';
        div.innerHTML = `
          <input type="checkbox" value="${u.id}" id="chk_${u.id}">
          <label for="chk_${u.id}" class="uname ${u.role === 'creator' ? 'creator' : ''}">${escapeHtml(u.name)}</label>
        `;
        box.appendChild(div);
      });
    }
    document.getElementById('groupModal').classList.add('active');
  }

  async function createGroup() {
    const name = document.getElementById('groupName').value.trim();
    const checks = document.querySelectorAll('#groupUsers input[type="checkbox"]:checked');
    const userIds = Array.from(checks).map(c => parseInt(c.value));

    if (!name) { alert('Введи название группы'); return; }
    if (userIds.length === 0) { alert('Выбери хотя бы одного участника'); return; }

    const res = await fetch('/chats/group', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, userIds })
    });
    const data = await res.json();
    if (data.ok) {
      closeModal('groupModal');
      await loadChats();
      socket.emit('join_chat', data.chatId);
      openChat(data.chatId, name, 'group');
    } else {
      alert(data.error || 'Ошибка');
    }
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('active');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  async function logout() {
    await fetch('/logout', { method: 'POST' });
    window.location.href = '/';
  }

  document.getElementById('msgInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') send();
  });

  // Закрытие модалок по клику вне окна
  document.querySelectorAll('.modal').forEach(m => {
    m.addEventListener('click', e => { if (e.target === m) m.classList.remove('active'); });
  });

  init();
</script>
</body>
</html>
